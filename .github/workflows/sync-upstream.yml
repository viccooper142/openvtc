name: Sync continuity fork from OpenVTC

on:
  schedule:
    - cron: "17 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openvtc-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'viccooper142/openvtc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Merge upstream source while preserving fork automation
        run: |
          git config user.name "openvtc-continuity-bot"
          git config user.email "actions@users.noreply.github.com"
          .github/scripts/sync-upstream.sh https://github.com/OpenVTC/openvtc.git main
          git push origin HEAD:main
